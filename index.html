<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leaders Board</title>
<!-- مكتبة الإكسل لقراءة وتحديث الشيتات -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<!-- مكتبات Firebase للمزامنة اللحظية (Real-time Live Sync) -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#14213d;--mut:#6b7280;--line:#e5e7eb;--bar:#2f6fd0;--track:#eceef3;--hi:#fffaea;--ok:#16a34a;--tg:#e5484d;color-scheme:light;box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--card:#171e2e;--ink:#e8ecf5;--mut:#98a2b3;--line:#27304a;--bar:#5b9bff;--track:#252d44;--hi:#2a2614;--ok:#34d399;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1420;--card:#171e2e;--ink:#e8ecf5;--mut:#98a2b3;--line:#27304a;--bar:#5b9bff;--track:#252d44;--hi:#2a2614;--ok:#34d399;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.35 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
main{max-width:1180px;margin:0 auto;padding:20px 16px 40px}
h1{margin:0;font-size:28px}h2{margin:26px 0 10px;font-size:20px;display:flex;gap:10px;align-items:baseline}
h2 small{font-size:12px;font-weight:400;color:var(--mut)}
#sub{color:var(--mut);margin-top:2px}
.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.actions{display:flex;gap:8px;align-items:center}
.g3,.k4{display:grid;gap:14px}.g3{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.k4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-top:14px}
.k,.c{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.k small{display:block;color:var(--mut);font-size:11px;letter-spacing:.04em;text-transform:uppercase}.k b{display:block;font-size:28px;margin:4px 0 2px}.k span{color:var(--mut);font-size:12px}
.c h3{margin:0;font-size:16px}.c>small{color:var(--mut);font-size:12px}
.r{display:grid;grid-template-columns:28px 1fr auto;column-gap:6px;padding:6px 6px 5px;border-radius:8px;margin-top:2px}
.r.t1{background:var(--hi)}.rk{grid-row:1/3;align-self:center;text-align:center;color:var(--mut);font-weight:600}
.r.t b{font-weight:700}.r i{font-style:normal;color:var(--mut);font-size:11px;margin-left:4px}.v{font-weight:700;text-align:right}
.bar{grid-column:2/4;height:6px;border-radius:3px;background:var(--track);position:relative;margin-top:3px}
.bar u{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--bar)}.bar u.ok{background:var(--ok)}
.bar s{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--tg)}
.ft{color:var(--mut);font-size:11px;margin-top:8px}
button,select,input{font:inherit;color:var(--ink)}button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover{filter:brightness(0.96)}
#panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:14px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.f label{font-size:12px;color:var(--mut)}
.f input,td input,td select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px}
.tw{overflow-x:auto;margin-top:12px}table{border-collapse:collapse;min-width:640px;width:100%}th{font-size:11px;color:var(--mut);text-align:left;padding:4px}td{padding:3px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}#st{color:var(--mut);font-size:12px;font-weight:600}
.status-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 8px;border-radius:12px;background:var(--track);color:var(--mut)}
.dot{width:8px;height:8px;border-radius:50%;background:#e5484d}
.dot.online{background:#16a34a}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<div class="top">
  <div>
    <h1 id="ttl"></h1>
    <div id="sub"></div>
  </div>
  <div class="actions">
    <div class="status-pill">
      <span class="dot" id="dot"></span>
      <span id="conn-text">Checking…</span>
    </div>
    <button id="eb">⚙️ تعديل الأرقام</button>
  </div>
</div>

<section id="panel" hidden>
  <div class="row" style="margin:0 0 12px;justify-content:space-between">
    <div style="display:flex;gap:8px;align-items:center">
      <button id="imp">📥 Import Excel / CSV</button>
      <input id="fi" type="file" accept=".xlsx,.xls,.csv" hidden>
      <span id="st"></span>
    </div>
  </div>
  <div class="f" id="sf"></div>
  <div class="tw">
    <table>
      <thead>
        <tr><th>Agent</th><th>Team</th><th>Cash (net)</th><th>Cash target</th><th>Contracts</th><th>First purchases</th><th>Upgraded</th><th></th></tr>
      </thead>
      <tbody id="tb"></tbody>
    </table>
  </div>
  <div class="row"><button id="add">+ Add agent</button></div>
</section>

<div class="k4" id="kp"></div>
<h2>Agents <small id="na"></small></h2><div class="g3" id="ag"></div>
<h2>Teams <small id="nt"></small></h2><div class="g3" id="tm"></div>
<div class="ft">Cash is net of refunds.</div>
</main>

<script>
// =============================================================================
// 1) بيانات Firebase - انسخ بيانات مشروعك وضعها هنا لتفعيل المزامنة اللحظية الأونلاين
// =============================================================================
const firebaseConfig = {
  // apiKey: "AIzaSy...",
  // authDomain: "your-project.firebaseapp.com",
  // projectId: "your-project",
  // storageBucket: "your-project.appspot.com",
  // messagingSenderId: "123456789",
  // appId: "1:123456789:web:abcdef..."
};

// كلمة سر لفتح التعديل (اتركها فارغة "" إذا كنت لا تريد حماية بكلمة سر):
const EDIT_PIN = "1234";

// البيانات الافتراضية الأولية
const SEED={"s": {"title": "Big Team GCC1 · DashBoard", "month": "November 2026", "asof": "14 Nov", "upg": 14, "cash": 87957, "con": 103.5, "uc": 0, "uct": 0, "uf": 0, "uu": 0, "xt": {"GCC03": 1963}, "rf": {"GCC03": 175, "GCC05": 175}}, "a": [["EGSS-omarsameh", "GCC01", 2770, 5645, 3, 23, 0], ["EGSS-fawziamoh", "GCC01", 4280, 8345, 4, 17, 1], ["EGSS-mohamedhanafy", "GCC01", 1050, 5215, 2, 5, 1], ["EGSS-alizain", "GCC01", 4196, 7015, 6, 18, 0], ["EGSS-pansee", "GCC01", 1590, 5215, 3, 15, 1], ["51abdelmotynour001", "GCC01", 3996, 4759, 5, 13, 1], ["EGSS-rahmaabdrabo", "GCC01", 0, 3107, 0, 21, 0], ["EGSS-doaam", "GCC03", 754, 5045, 2, 17, 2], ["EGSS-mohamedahmed03", "GCC03", -611, 5015, 2, 24, 1], ["EGSS-salmagoda", "GCC03", 5210, 3607, 6, 16, 2], ["EGSS-yara02", "GCC03", 1535, 3107, 1, 20, 1], ["EGSS-YoussefAbdallah", "GCC05", 3019, 4715, 1, 11, 0], ["EGLP-AhmedNabil", "GCC05", 3164, 4845, 3, 24, 0], ["EGSS-hazemgamal", "GCC05", 800, 3107, 1, 14, 0], ["EGSS-mahmoudmohamedm", "GCC05", 2415, 6409, 1, 19, 1], ["EGSS-kerorefky", "GCC05", 3815, 4915, 4, 22, 3], ["EGSS-habibaza", "GCC05", 2265, 5928, 5, 20, 3]]};

let S = JSON.parse(localStorage.getItem("lb") || JSON.stringify(SEED));
let db = null, ref = null, timer = null;

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const m = n => (n<0?"-":"")+"$"+Math.abs(Math.round(n)).toLocaleString("en-US");
const p = n => (n*100).toFixed(1)+"%";
const nn = n => (+n).toLocaleString("en-US",{maximumFractionDigits:1});
const FIELDS = [["title","Dashboard title","text"],["month","Month","text"],["asof","As-of date","text"],["upg","Upgrade target %","number"],["cash","Big Team cash target","number"],["con","Big Team contracts target","number"],["uc","Unlisted cash","number"],["uct","Unlisted contracts","number"],["uf","Unlisted first purchases","number"],["uu","Unlisted upgraded","number"]];

function calc(){
  const A=S.a.filter(r=>r[0]).map(r=>({n:r[0],t:r[1],c:+r[2]||0,g:+r[3]||0,k:+r[4]||0,f:+r[5]||0,u:+r[6]||0}));
  A.forEach(x=>{x.ach=x.g?x.c/x.g:0;x.ur=x.f?x.u/x.f:0});
  const T={};
  A.forEach(x=>{const o=T[x.t]||(T[x.t]={n:x.t,c:0,g:0,f:0,u:0,N:0});o.c+=x.c;o.g+=x.g;o.f+=x.f;o.u+=x.u;o.N++});
  const TT=Object.values(T),rf=S.s.rf||{};
  TT.forEach(x=>{x.c-=Math.abs(+rf[x.n]||0);x.g+=+((S.s.xt||{})[x.n])||0;x.ach=x.g?x.c/x.g:0;x.ur=x.f?x.u/x.f:0});
  return{A,TT};
}

function rank(L,k){
  const s=[...L].sort((a,b)=>b[k]-a[k]);
  let r=0;
  return s.map((x,i)=>{if(!i||Math.abs(x[k]-s[i-1][k])>1e-9)r=i+1;return{x,r}});
}

function card(t,sub,L,k,f,tag,tg){
  const R=rank(L,k),mx=Math.max(...R.map(o=>o.x[k]),tg||0,1e-9);
  return`<div class="c"><h3>${t}</h3><small>${sub}</small>`+R.map(({x,r})=>{const w=Math.max(0,x[k])/mx*100;
  return`<div class="r${r==1?" t1":""}${r<4?" t":""}"><span class="rk">${["🥇","🥈","🥉"][r-1]||r}</span><span><b>${esc(x.n)}</b>${tag(x)}</span><span class="v">${f(x[k])}</span><div class="bar"><u class="${tg&&x[k]>=tg?"ok":""}" style="width:${w}%"></u>${tg?`<s style="left:${tg/mx*100}%"></s>`:""}</div></div>`}).join("")+(tg?`<div class="ft">| ${p(tg)} target · green = reached it</div>`:"")+`</div>`;
}

function draw(){
  const{A,TT}=calc(),s=S.s;
  const sum=k=>A.reduce((a,x)=>a+x[k],0);
  const rt=Object.values(s.rf||{}).reduce((a,v)=>a+Math.abs(+v||0),0);
  const tc=sum("c")+(+s.uc||0)-rt, tk=sum("k")+(+s.uct||0), tf=sum("f")+(+s.uf||0), tu=sum("u")+(+s.uu||0), tg=(+s.upg||0)/100;
  
  $("#ttl").textContent=s.title;
  document.title=s.title;
  $("#sub").textContent=`${s.month} · as of ${s.asof} · ${A.length} agents · ${TT.length} teams`;
  $("#kp").innerHTML=[["Cash",m(tc),`of ${m(+s.cash||0)} target`],["Cash achievement",s.cash?p(tc/s.cash):"–",`${m(Math.max(0,s.cash-tc))} to go`],["Contracts",nn(tk),`of ${nn(+s.con||0)} target · closed this month`],["Upgrade rate",tf?p(tu/tf):"–",`${tu} of ${tf} · target ${nn(s.upg)}%`]].map(a=>`<div class="k"><small>${a[0]}</small><b>${a[1]}</b><span>${a[2]}</span></div>`).join("");
  $("#na").textContent=`all ${A.length} ranked`;
  $("#nt").textContent=`all ${TT.length} ranked`;
  
  const D=[["Highest cash","net of refunds","c",m],["Highest cash achievement","% of cash target","ach",p],["Highest upgrade rate","upgraded ÷ first purchases","ur",p,tg]];
  $("#ag").innerHTML=D.map(d=>card(d[0],d[1],A,d[2],d[3],x=>`<i>${esc(x.t)}</i>`,d[4])).join("");
  $("#tm").innerHTML=D.map(d=>card(d[0],d[1],TT,d[2],d[3],x=>`<i>${x.N} agents</i>`,d[4])).join("");
}

function teams(){
  return[...new Set(["GCC01","GCC03","GCC05",...S.a.map(r=>r[1]).filter(Boolean)])];
}

function table(){
  $("#tb").innerHTML=S.a.map((r,i)=>"<tr>"+[0,1,2,3,4,5,6].map(j=>j==1?`<td><select data-i="${i}" data-j="1">${teams().map(t=>`<option${t==r[1]?" selected":""}>${t}</option>`).join("")}</select></td>`:`<td><input data-i="${i}" data-j="${j}" value="${esc(r[j])}"${j?' type="number" step="any"':""}></td>`).join("")+`<td><button data-d="${i}">×</button></td></tr>`).join("");
}

function fields(){
  $("#sf").innerHTML=FIELDS.map(([k,l,t])=>`<div><label>${l}<input data-k="${k}" type="${t}" step="any" value="${esc(S.s[k]??"")}"></label></div>`).join("")+teams().map(t=>`<div><label>Refund cash · ${t}<input data-r="${t}" type="number" step="any" value="${esc((S.s.rf||{})[t]??0)}"></label></div>`).join("")+teams().map(t=>`<div><label>Extra target · ${t}<input data-x="${t}" type="number" step="any" value="${esc((S.s.xt||{})[t]??0)}"></label></div>`).join("");
}

function save(){
  clearTimeout(timer);
  $("#st").textContent="جاري الحفظ…";
  timer=setTimeout(async()=>{
    try{
      if(ref){
        await ref.set({json:JSON.stringify(S)});
        $("#st").textContent="✅ تم الحفظ أونلاين وتسميع التعديل للكل";
      }else{
        localStorage.setItem("lb",JSON.stringify(S));
        $("#st").textContent="💾 محفوظ محلياً (ضع كود Firebase للمزامنة الأونلاين)";
      }
    }catch(e){
      console.error(e);
      $("#st").textContent="❌ تعذر الحفظ: "+e.message;
    }
  },500);
}

// تعديل أي خانة في جدول الموظفين
$("#tb").addEventListener("input",e=>{
  const t=e.target,i=+t.dataset.i,j=+t.dataset.j;
  if(isNaN(i))return;
  S.a[i][j]=j<2?t.value:t.value===""?"":+t.value;
  draw();save();
});

// حذف موظف
$("#tb").addEventListener("click",e=>{
  const d=e.target.dataset.d;
  if(d===undefined)return;
  S.a.splice(+d,1);
  table();draw();save();
});

// تعديل الإعدادات العامة والتارجت
$("#sf").addEventListener("input",e=>{
  const t=e.target,k=t.dataset.k;
  if(t.dataset.x){S.s.xt=S.s.xt||{};S.s.xt[t.dataset.x]=+t.value||0;draw();save();return}
  if(t.dataset.r){S.s.rf=S.s.rf||{};S.s.rf[t.dataset.r]=+t.value||0;draw();save();return}
  S.s[k]=t.type=="number"?(t.value===""?0:+t.value):t.value;
  draw();save();
});

// إضافة موظف جديد
$("#add").onclick=()=>{
  S.a.push(["","GCC01","","","","",""]);
  table();save();
};

// زرار فتح / إغلاق التعديل
$("#eb").onclick=()=>{
  const panel = $("#panel");
  if(panel.hidden){
    if(EDIT_PIN){
      const pin = prompt("أدخل كلمة المرور لتعديل البيانات:");
      if(pin !== EDIT_PIN){
        alert("كلمة المرور غير صحيحة!");
        return;
      }
    }
    panel.hidden = false;
    $("#eb").textContent = "✕ إغلاق التعديل";
    fields();
    table();
  } else {
    panel.hidden = true;
    $("#eb").textContent = "⚙️ تعديل الأرقام";
  }
};

// زرار رفع شيت الإكسل
$("#imp").onclick=()=>$("#fi").click();
$("#fi").onchange=async e=>{
  const f=e.target.files[0];
  if(!f)return;
  try{
    const wb=XLSX.read(await f.arrayBuffer()),W=wb.Sheets;
    const sh=W.Agents||W[wb.SheetNames.find(n=>!/^(instructions|settings)$/i.test(n))||wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(sh,{defval:""}),g=(r,re)=>r[Object.keys(r).find(x=>re.test(x.toLowerCase().trim()))];
    const a=rows.map(r=>[g(r,/^agent/),g(r,/^team/),g(r,/^cash(?! target| ach)/),g(r,/^cash target/),g(r,/contract/),g(r,/first/),g(r,/^upgraded/)]).filter(r=>String(r[0]||"").trim()).map(r=>r.map((v,j)=>j<2?String(v).trim():v===""?"":+v));
    if(!a.length)throw 0;
    S.a=a;
    if(W.Settings){
      const R=XLSX.utils.sheet_to_json(W.Settings,{header:1}),v=re=>{const r=R.find(r=>re.test(String(r[0]||"").toLowerCase()));return r&&r[1]!==undefined&&r[1]!==""?r[1]:undefined},set=(k,x,fn)=>{if(x!==undefined)S.s[k]=fn?fn(x):x};
      set("title",v(/title/));set("month",v(/^month/));
      const ao=v(/as-of/);if(ao!==undefined)S.s.asof=typeof ao=="number"?`${ao} ${String(S.s.month).slice(0,3)}`:ao;
      set("upg",v(/upgrade rate target/),x=>x<=1?x*100:+x);
      set("cash",v(/big team cash/),Number);
      set("con",v(/big team contracts/),Number);
      set("uc",v(/unlisted cash/),Number);
      set("uct",v(/unlisted contracts/),Number);
      set("uf",v(/unlisted first/),Number);
      set("uu",v(/unlisted upgraded/),Number);
      R.forEach(r=>{const mt=/refund.*(gcc\d+)/i.exec(String(r[0]||""));if(mt&&r[1]!==undefined&&r[1]!=="")(S.s.rf=S.s.rf||{})[mt[1].toUpperCase()]=Math.abs(+r[1]||0)});
      R.forEach(r=>{const mt=/extra target.*(gcc\d+)/i.exec(String(r[0]||""));if(mt&&r[1]!==undefined&&r[1]!=="")(S.s.xt=S.s.xt||{})[mt[1].toUpperCase()]=+r[1]||0});
    }
    fields();table();draw();save();
    $("#st").textContent=`تم استيراد ${a.length} موظف بنجاح ✅`;
  }catch(x){
    $("#st").textContent="تعذر قراءة ملف الإكسل ⚠️";
  }
  e.target.value="";
};

// =============================================================================
// 2) تهيئة الربط اللحظي مع Firebase Firestore
// =============================================================================
if(firebaseConfig.projectId){
  try {
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    ref = db.collection("leaderboard").doc("main");
    
    // المزامنة اللحظية: بمجرد ما أي حد يغير رقم، الصفحة تتحدث تلقائياً عند الكل
    ref.onSnapshot(doc => {
      $("#dot").className = "dot online";
      $("#conn-text").textContent = "Live Online";
      if(doc.exists && doc.data().json){
        S = JSON.parse(doc.data().json);
        draw();
        if(!$("#panel").hidden){
          fields();
          table();
        }
      } else {
        // رفع البيانات الأولية للمرة الأولى
        ref.set({json: JSON.stringify(S)});
      }
    }, err => {
      console.error(err);
      $("#conn-text").textContent = "Connection issue";
    });
  } catch(e) {
    console.error(e);
    $("#conn-text").textContent = "Init error";
  }
} else {
  // وضع العمل المحلي (بدون إنترنت أو قبل وضع مفاتيح Firebase)
  $("#dot").className = "dot";
  $("#conn-text").textContent = "Local Mode";
}

draw();
</script>
</body>
</html>
